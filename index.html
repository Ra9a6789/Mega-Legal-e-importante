function newG(){S={sc:'a1',i:0,cl:[],tr:0,br:0,v:[]};$('sp').innerHTML='';choosing=0;$('ch').classList.add('hidden');scr('vn');step()}
function cont(){let d=null;try{d=JSON.parse(ld('amab'))}catch(e){}if(!d)return newG();S=d;$('sp').innerHTML='';choosing=0;$('ch').classList.add('hidden');scr('vn');view(null);step()}
function menu(){scr('menu');$('bc').disabled=!ld('amab');setM('fundo1')}
let tt;function toast(t){const e=$('ct');e.textContent=t;e.classList.remove('hidden');e.style.animation='none';void e.offsetWidth;e.style.animation='';clearTimeout(tt);tt=setTimeout(()=>e.classList.add('hidden'),2400)}
function clue(c){if(S.cl.includes(c))return;S.cl.push(c);toast('🔎 Pista: '+c)}
function sprites(l,w,x){const b=$('sp');[...b.children].forEach(e=>{if(!l.includes(e.dataset.k)&&!e.classList.contains('out')){e.classList.add('out');setTimeout(()=>e.remove(),320)}});
l.forEach(k=>{let e=b.querySelector('[data-k="'+k+'"]:not(.out)');if(!e){e=document.createElement('div');e.className='sp in'+(k=='acine'?' boss':'');e.dataset.k=k;fi(e,[k],k);b.append(e);setTimeout(()=>e.classList.remove('in','boss'),1000);if(k=='acine'){const v=$('vn');v.classList.remove('flsh');void v.offsetWidth;v.classList.add('flsh')}}
e.classList.toggle('on',k==w||w=='N');['happy','mad','shock','sad'].forEach(z=>e.classList.remove('x-'+z));if(k==w&&x){void e.offsetWidth;e.classList.add('x-'+x)}})}
function view(st){$('vn').dataset.th=S.th||'day';setM(S.m?'fundo'+S.m:null);sprites(S.sp||[],st?st.w:null,st?st.x:null);const sc=SC[S.sc];if(sc){$('al').textContent=ACT[sc.a];$('pf').style.width=Math.min(100,sc.p+(sc.a==2?S.v.length*6:0))+'%'}}
function say(w,t){const n=$('nm');n.textContent=C[w].n;n.style.background=C[w].c;n.style.display=w=='N'?'none':'block';const el=$('tx');el.textContent='';el.classList.remove('n');void el.offsetWidth;el.classList.add('n');$('bx').classList.remove('rdy');full=t;let i=0;clearInterval(typing);typing=setInterval(()=>{el.textContent=t.slice(0,++i);if(i>=t.length){clearInterval(typing);typing=null;$('bx').classList.add('rdy');autoGo()}},18)}
function go(id){wait=1;$('fd').classList.add('on');setTimeout(()=>{const pa=SC[S.sc]&&SC[S.sc].a;S.sc=id;S.i=0;if(SC[id].a!==pa)toast('✨ '+ACT[SC[id].a]);$('fd').classList.remove('on');wait=0;step()},350)}
function step(){
if(wait||!S)return;const sc=SC[S.sc],st=sc&&sc.s[S.i];if(!st){menu();return}
if(st.q&&!st.q(S)){S.i++;return step()}
if(st.g)return go(st.g);if(st.bt)return btStart();if(st.end)return finish(st.end);
if(st.ch){choosing=1;const box=$('ch');box.innerHTML='';box.classList.remove('hidden');
st.ch(S).forEach((o,i)=>{const b=document.createElement('button');b.className='cb';b.style.animationDelay=i*90+'ms';b.textContent=o.t;b.onclick=()=>{sfx();box.classList.add('hidden');choosing=0;o.f&&o.f(S);if(o.g)go(o.g);else{S.i++;step()}};box.append(b)});return}
if(st.th)S.th=st.th;if(st.m)S.m=st.m;if(st.s)S.sp=st.s;if(st.c)clue(st.c);
S.i++;sv('amab',JSON.stringify(S));view(st);say(st.w,st.t)}
$('bx').onclick=()=>{if(wait||choosing||!S)return;if(typing){clearInterval(typing);typing=null;$('tx').textContent=full;$('bx').classList.add('rdy');autoGo()}else step()};

const AHM=140;let auto=0,ta;
const SK=[
{n:'Bolo Pinguelado',d:'dano',c:10,g:'🎂',f:()=>['Manu arremessa um Bolo Pinguelado na cara da Acine! SPLAT!',R(16,24)+S.cl.length]},
{n:'Pinguelo Ardido',d:'veneno por 4 turnos',c:15,g:'🌶️',f:()=>{B.pz=4;return['O Pinguelo Ardido gruda na Acine! Ela está ENVENENADA e ardendo!',5]}},
{n:'Usar Rafael como escudo',d:'defesa por 2 turnos',c:12,g:'🛡️',f:()=>{B.rf=2;return['Manu agarra o Rafael e usa como escudo! "POR QUE EU?!" grita Rafael.',0]}}];
const MV=[
{n:'DETENÇÃO EXPLOSIVA',g:'💥',d:[12,18],t:'Uma chuva de apagadores cai na Manu!'},
{n:'SERMÃO INFINITO',g:'💤',d:[8,12],pa:15,t:'Manu perde 15 de energia de tanto bocejar.'},
{n:'ADVERTÊNCIA VENENOSA',g:'📝',d:[16,22],t:'"Isso vai pro seu boletim!"'},

{n:'REGULAMENTO ESCOLAR',g:'📜',s:1,t:'Escudo de burocracia! O próximo golpe da Manu perde força!'}];
SK.forEach((k,i)=>{const b=document.createElement('button');b.innerHTML=k.n+'<small>'+k.c+' PA · '+k.d+'</small>';b.onclick=()=>act(i);$('ak').append(b)});
const msg=t=>$('ms').textContent=t,vib=()=>{try{navigator.vibrate&&navigator.vibrate(80)}catch(e){}};
function pick(){let m;do{m=MV[R(0,4)]}while(m.h&&(B.hl||B.ah>100));if(B.ah<70&&Math.random()<.3)m=MV[2];return m}
function hurtA(x){B.ah-=x;if(B.ah<=0&&!B.last){B.ah=1;B.last=1}}
function turn(w){$('bm').classList.toggle('turn',w=='m');$('ba').classList.toggle('turn',w=='a')}
function ui(){const w=(i,v,m,c)=>{const e=$(i),q=Math.max(0,v/m);e.style.width=q*100+'%';if(c)e.style.background=q<.3?'#ff5252':q<.6?'#ffb020':'#3ddc84'};
w('ahb',B.ah,AHM);w('mhb',B.mh,B.MH,1);w('mpb',B.mp,100);
$('aht').textContent='HP '+Math.max(0,B.ah)+'/'+AHM+(B.pz>0?' · ☠️ Veneno ('+B.pz+')':'')+(B.as?' · 📜 Escudo':'');
$('mht').textContent='HP '+Math.max(0,B.mh)+'/'+B.MH+' · PA '+B.mp+(B.rf>0?' · 🛡️ Rafael ('+B.rf+')':'');
$('ak').classList.toggle('lk',!!lk);[...$('ak').children].forEach((b,i)=>b.disabled=B.mp<SK[i].c)}
function an(id,c){const e=$(id);e.classList.remove(c);void e.offsetWidth;e.classList.add(c);setTimeout(()=>e.classList.remove(c),700)}
function fl(id,t,g,big){const s=document.createElement('span');s.className='fl'+(g?' g':'')+(big?' big':'');s.textContent=t;$(id).append(s);setTimeout(()=>s.remove(),1000)}

function btStart(){scr('bt');setM('fundo2');B={mh:Math.max(90,110+S.tr*10),mp:60,ah:AHM,pz:0,rf:0,as:0,hl:0,last:0};B.MH=B.mh;B.nx=pick();
$('bres').className='hidden';$('fin').className='hidden';lk=0;turn('m');ui();msg('Acine bloqueia a saída com um olhar de DETENÇÃO!');
$('tn').textContent='Sua vez, Manu!';$('it').textContent='⚠️ Acine vai usar: '+B.nx.n;an('aci','intro')}
async function act(n){if(lk||!B||!SK[n])return;const k=SK[n];if(B.mp<k.c){msg('Energia insuficiente!');return}
lk=1;B.mp-=k.c;turn('m');ui();$('tn').textContent='Manu usa '+k.n+'!';$('it').textContent='';
const[m,d]=k.f();an('mui','atk');burst(d?'ba':'bm',k.g,10);await sl(500);msg(m);if(!d)an('mui','heal');
if(d){let x=d;const c=Math.random()<.15;if(c)x=Math.round(x*1.5);if(B.as){x=Math.round(x/2);B.as=0}hurtA(x);an('aci','hit');an('bt','shk');fl('ba','-'+x+(c?' CRÍTICO!':''),0,c)}
ui();await sl(1000);if(B.last)return finale();
await enemy();if(B.mh<=0)return over(0);
await tick();if(B.last)return finale();
B.mp=Math.min(100,B.mp+12);if(B.rf>0)B.rf--;B.nx=pick();lk=0;turn('m');ui();$('tn').textContent='Sua vez, Manu!';$('it').textContent='⚠️ Acine vai usar: '+B.nx.n}
async function enemy(){turn('a');ui();$('tn').textContent='Vez da Acine...';await sl(800);const m=B.nx;let d=0;
$('tn').textContent='Acine usa '+m.n+'!';an('aci','atk2');burst(m.d?'bm':'ba',m.g,8);await sl(500);msg(m.t);
if(m.s)B.as=1;if(m.h){B.hl=1;B.ah=Math.min(AHM,B.ah+m.h);fl('ba','+'+m.h,1)}
if(m.d){d=R(m.d[0],m.d[1]);if(B.rf>0)d=Math.round(d*.4);if(m.pa)B.mp=Math.max(0,B.mp-m.pa);B.mh-=d;an('mui','hit');an('bt','shk');fl('bm','-'+d);vib()}
ui();await sl(1200)}

B.mh=0;an('mui','hit');an('bt','shk');fl('bm','-9999',0,1);vib();ui();await sl(1100);

f.className='';f.textContent='VOCÊ SE RECUSA A SER DERROTADA!';B.mh=1;ui();an('mui','heal');burst('bm','💖',12);await sl(2400);
f.className='hidden';turn('m');$('tn').textContent='Contra-ataque final!';msg('Manu une o Pinguelo Ardido e o Bolo Pinguelado num golpe só!');an('mui','atk');burst('ba','🎂',14);await sl(700);
B.ah=0;an('aci','hit');an('bt','shk');fl('ba','-40',0,1);vib();ui();await sl(1400);over(1)}
